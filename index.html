<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>LFIV Noël 2025 – Votre QR Famille</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Police -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <!-- Librairie QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Montserrat", system-ui, -apple-system, sans-serif;
      color: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
      background:
        radial-gradient(circle at top, rgba(248, 250, 252, 0.15), transparent 55%),
        radial-gradient(circle at bottom, rgba(248, 250, 252, 0.08), transparent 60%),
        linear-gradient(135deg, #0f172a, #1d3b5c 40%, #14532d 80%);
      position: relative;
    }

    /* Halo lumineux animé */
    .glow {
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 999px;
      background:
        radial-gradient(circle, rgba(248, 250, 252, 0.08), transparent 55%);
      filter: blur(2px);
      animation: glowMove 18s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .glow.glow-2 {
      width: 380px;
      height: 380px;
      opacity: 0.8;
      animation-duration: 24s;
      animation-direction: alternate-reverse;
    }

    @keyframes glowMove {
      0%   { transform: translate(-40%, -30%); }
      50%  { transform: translate(20%, -10%); }
      100% { transform: translate(40%, 20%); }
    }

    /* Flocons */
    .snow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }
    .snowflake {
      position: absolute;
      top: -10%;
      color: rgba(248, 250, 252, 0.8);
      font-size: 0.9rem;
      animation: snowfall linear infinite;
      text-shadow: 0 0 6px rgba(15, 23, 42, 0.5);
    }
    @keyframes snowfall {
      0%   { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translate3d(0, 110vh, 0) rotate(360deg); opacity: 0; }
    }

    .wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 460px;
    }

    .card {
      position: relative;
      background: rgba(15, 23, 42, 0.92);
      border-radius: 26px;
      padding: 22px 18px 20px;
      box-shadow:
        0 22px 60px rgba(15, 23, 42, 0.85),
        0 0 0 1px rgba(148, 163, 184, 0.2);
      backdrop-filter: blur(12px);
      overflow: hidden;
      animation: cardIn 0.7s ease-out both;
    }

    @keyframes cardIn {
      0%   { opacity: 0; transform: translateY(20px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Ruban */
    .ribbon {
      position: absolute;
      top: 12px;
      left: -60px;
      background: linear-gradient(135deg, #fbbf24, #f97316);
      color: #111827;
      padding: 7px 60px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      transform: rotate(-12deg);
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    }

    .header {
      text-align: center;
      margin-top: 26px;
      margin-bottom: 10px;
    }

    .school {
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #e5e7eb;
      opacity: 0.85;
      margin-bottom: 4px;
    }

    .title {
      font-family: "Playfair Display", serif;
      font-size: 1.9rem;
      font-weight: 900;
      color: #f9fafb;
      text-shadow: 0 3px 10px rgba(0,0,0,0.4);
      margin-bottom: 2px;
    }

    .year {
      font-size: 0.92rem;
      font-weight: 600;
      color: #a5b4fc;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .subtitle {
      margin-top: 14px;
      font-size: 0.92rem;
      color: #cbd5f5;
      line-height: 1.4;
    }

    .highlight {
      color: #facc15;
      font-weight: 600;
    }

    .tagline {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #9ca3af;
    }

    .code-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(15, 118, 110, 0.25);
      border: 1px solid rgba(34, 197, 94, 0.45);
      color: #bbf7d0;
      font-size: 0.82rem;
      font-weight: 600;
      margin: 16px auto 0;
      gap: 6px;
    }
    .code-pill span.code-value {
      font-family: "Montserrat", monospace;
      font-weight: 700;
      color: #fefce8;
    }

    .qr-wrapper {
      margin-top: 14px;
      display: flex;
      justify-content: center;
    }

    .qr-card {
      position: relative;
      padding: 12px;
      border-radius: 22px;
      background:
        radial-gradient(circle at top, #fef9c3, transparent 65%),
        #020617;
      box-shadow:
        0 12px 35px rgba(15, 23, 42, 0.9),
        0 0 0 1px rgba(148, 163, 184, 0.35);
      animation: qrIn 0.7s ease-out 0.15s both;
    }

    @keyframes qrIn {
      0%   { opacity: 0; transform: translateY(10px) scale(0.94); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .qr-halo {
      position: absolute;
      inset: -25%;
      background:
        radial-gradient(circle, rgba(252, 211, 77, 0.07), transparent 60%);
      filter: blur(4px);
      pointer-events: none;
    }

    #qrcode {
      position: relative;
      width: 260px;
      height: 260px;
      border-radius: 18px;
      overflow: hidden;
      background: #020617;
    }

    .qr-caption {
      text-align: center;
      font-size: 0.8rem;
      color: #e5e7eb;
      margin-top: 8px;
      opacity: 0.92;
    }

    .qr-caption small {
      display: block;
      font-size: 0.76rem;
      color: #9ca3af;
      margin-top: 2px;
    }

    .footer {
      margin-top: 14px;
      font-size: 0.78rem;
      text-align: center;
      color: #9ca3af;
      line-height: 1.4;
    }

    .footer code {
      background: rgba(15, 23, 42, 0.95);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 0.76rem;
      border: 1px solid rgba(148, 163, 184, 0.4);
    }

    /* État erreur */
    .error-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fecaca;
      margin-top: 10px;
      margin-bottom: 4px;
    }
    .error-text {
      font-size: 0.9rem;
      color: #fecaca;
      margin-bottom: 10px;
    }
    .error-hint {
      font-size: 0.8rem;
      color: #e5e7eb;
    }

    @media (max-width: 480px) {
      .card {
        padding: 20px 16px 18px;
        border-radius: 22px;
      }
      .header {
        margin-top: 22px;
      }
      .title {
        font-size: 1.6rem;
      }
      .subtitle {
        font-size: 0.88rem;
      }
      #qrcode {
        width: 220px;
        height: 220px;
      }
    }
  </style>
</head>
<body>
  <!-- halos animés -->
  <div class="glow" style="top:-10%;left:-5%;"></div>
  <div class="glow glow-2" style="bottom:-20%;right:-10%;"></div>

  <!-- neige -->
  <div class="snow" id="snow-layer"></div>

  <div class="wrapper">
    <div class="card" id="card">
      <div class="ribbon">Fête de fin d’année</div>

      <div class="header">
        <div class="school">Lycée Français International de Vientiane</div>
        <div class="title">Soirée de Noël</div>
        <div class="year">2025 • Accès familles</div>
      </div>

      <p class="subtitle">
        Nous n’avons pas trouvé votre <span class="highlight">code famille</span>.
      </p>
      <p class="tagline">
        Le lien doit ressembler à&nbsp;:
        <br><code>https://noel.lfiv.org/?c=12345</code>
      </p>
    </div>
  </div>

  <script>
    // --- Flocons animés ---
    (function createSnow() {
      const snowLayer = document.getElementById("snow-layer");
      const flakes = 40;
      for (let i = 0; i < flakes; i++) {
        const span = document.createElement("span");
        span.className = "snowflake";
        span.textContent = Math.random() > 0.6 ? "❆" : "❄";
        span.style.left = Math.random() * 100 + "%";
        span.style.fontSize = (Math.random() * 10 + 8) + "px";
        span.style.animationDuration = (Math.random() * 8 + 10) + "s";
        span.style.animationDelay = (Math.random() * 8) + "s";
        snowLayer.appendChild(span);
      }
    })();

    (function init() {
      const params = new URLSearchParams(window.location.search);
      const code = (params.get("c") || "").trim();
      const card = document.getElementById("card");

      if (!code) {
        // On laisse l'état erreur déjà présent dans le HTML
        return;
      }

      // Contenu "succès" avec QR
      card.innerHTML = `
        <div class="ribbon">Invitation famille</div>

        <div class="header">
          <div class="school">Lycée Français International de Vientiane</div>
          <div class="title">Soirée de Noël</div>
          <div class="year">2025 • Accès famille</div>
        </div>

        <p class="subtitle">
          Présentez ce <span class="highlight">QR code</span> à l'entrée le soir de la fête.<br>
          Un seul QR par famille suffit.
        </p>
        <p class="tagline">
          Pour gagner du temps, gardez cette page ouverte ou faites une capture d'écran.
        </p>

        <div class="code-pill">
          <span>Code famille :</span>
          <span class="code-value">${code}</span>
        </div>

        <div class="qr-wrapper">
          <div class="qr-card">
            <div class="qr-halo"></div>
            <div id="qrcode"></div>
          </div>
        </div>

        <p class="qr-caption">
          Ce QR est <strong>unique</strong> pour votre famille.
          <small>Il peut être scanné depuis un téléphone ou un QR imprimé.</small>
        </p>

        <div class="footer">
          En cas de problème, merci de vous adresser à l'équipe d'accueil.<br>
          <code>noel.lfiv.org</code>
        </div>
      `;

      // Génération du QR avec l'URL complète (pour le scanner)
      const qrContainer = document.getElementById("qrcode");
      if (!qrContainer) return;

      const url = window.location.origin + window.location.pathname + "?c=" + encodeURIComponent(code);

      new QRCode(qrContainer, {
        text: url,
        width: 260,
        height: 260,
        colorDark: "#f9fafb",
        colorLight: "#020617",
        correctLevel: QRCode.CorrectLevel.H
      });
    })();
  </script>
</body>
</html>
