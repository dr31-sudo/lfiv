<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>LFIV Noël 2025 – Votre QR Famille</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Polices -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <!-- Librairie QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Montserrat", system-ui, -apple-system, sans-serif;
      color: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
      background:
        radial-gradient(circle at top, rgba(248, 250, 252, 0.12), transparent 55%),
        radial-gradient(circle at bottom, rgba(248, 250, 252, 0.06), transparent 60%),
        linear-gradient(135deg, #7f1d1d, #991b1b 40%, #111827 85%);
      position: relative;
    }

    /* halos animés */
    .glow {
      position: absolute;
      width: 460px;
      height: 460px;
      border-radius: 999px;
      background:
        radial-gradient(circle, rgba(248, 250, 252, 0.09), transparent 60%);
      filter: blur(3px);
      animation: glowMove 18s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .glow.glow-2 {
      width: 360px;
      height: 360px;
      opacity: 0.8;
      animation-duration: 24s;
      animation-direction: alternate-reverse;
    }

    @keyframes glowMove {
      0%   { transform: translate(-35%, -25%); }
      50%  { transform: translate(15%, -10%); }
      100% { transform: translate(35%, 15%); }
    }

    /* neige */
    .snow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }
    .snowflake {
      position: absolute;
      top: -10%;
      color: rgba(248, 250, 252, 0.9);
      font-size: 0.9rem;
      animation: snowfall linear infinite;
      text-shadow: 0 0 6px rgba(127, 29, 29, 0.6);
    }
    @keyframes snowfall {
      0%   { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translate3d(0, 110vh, 0) rotate(360deg); opacity: 0; }
    }

    .wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 460px;
    }

    .card {
      position: relative;
      background: rgba(248, 250, 252, 0.98);
      border-radius: 26px;
      padding: 22px 18px 20px;
      box-shadow:
        0 22px 60px rgba(15, 23, 42, 0.9),
        0 0 0 1px rgba(127, 29, 29, 0.35);
      backdrop-filter: blur(12px);
      overflow: hidden;
      animation: cardIn 0.7s ease-out both;
      color: #111827;
    }

    @keyframes cardIn {
      0%   { opacity: 0; transform: translateY(20px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Ruban */
    .ribbon {
      position: absolute;
      top: 12px;
      left: -60px;
      background: linear-gradient(135deg, #facc15, #f97316);
      color: #7f1d1d;
      padding: 7px 60px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      transform: rotate(-12deg);
      box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    }

    .header {
      text-align: center;
      margin-top: 26px;
      margin-bottom: 10px;
    }

    .school {
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #b91c1c;
      opacity: 0.95;
      margin-bottom: 4px;
    }

    .title {
      font-family: "Playfair Display", serif;
      font-size: 1.9rem;
      font-weight: 900;
      color: #7f1d1d;
      text-shadow: 0 2px 6px rgba(248, 113, 113, 0.4);
      margin-bottom: 2px;
    }

    .year {
      font-size: 0.92rem;
      font-weight: 600;
      color: #ef4444;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .subtitle {
      margin-top: 14px;
      font-size: 0.92rem;
      color: #374151;
      line-height: 1.4;
    }

    .highlight {
      color: #b91c1c;
      font-weight: 600;
    }

    .tagline {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #6b7280;
    }

    .code-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      border-radius: 999px;
      background: #fee2e2;
      border: 1px solid #fecaca;
      color: #7f1d1d;
      font-size: 0.82rem;
      font-weight: 600;
      margin: 16px auto 0;
      gap: 6px;
    }
    .code-pill span.code-value {
      font-family: "Montserrat", monospace;
      font-weight: 700;
      color: #b91c1c;
    }

    .qr-wrapper {
      margin-top: 14px;
      display: flex;
      justify-content: center;
    }

    .qr-card {
      position: relative;
      padding: 12px;
      border-radius: 22px;
      background: #fef2f2;
      box-shadow:
        0 12px 35px rgba(127, 29, 29, 0.6),
        0 0 0 1px rgba(248, 113, 113, 0.6);
      animation: qrIn 0.7s ease-out 0.15s both;
    }

    @keyframes qrIn {
      0%   { opacity: 0; transform: translateY(10px) scale(0.94); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    #qrcode {
      position: relative;
      width: 260px;
      height: 260px;
      border-radius: 14px;
      overflow: hidden;
      background: #ffffff; /* important pour contraste max */
    }

    .qr-caption {
      text-align: center;
      font-size: 0.8rem;
      color: #4b5563;
      margin-top: 8px;
      opacity: 0.95;
    }

    .qr-caption small {
      display: block;
      font-size: 0.76rem;
      color: #6b7280;
      margin-top: 2px;
    }

    .actions {
      margin-top: 10px;
      display: flex;
      justify-content: center;
    }
    .btn-download {
      border: none;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      background: linear-gradient(135deg, #b91c1c, #dc2626);
      color: #fef2f2;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(185, 28, 28, 0.5);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-download:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(185, 28, 28, 0.6);
    }
    .btn-download:active {
      transform: translateY(0);
      box-shadow: 0 3px 10px rgba(185, 28, 28, 0.5);
    }

    .footer {
      margin-top: 14px;
      font-size: 0.78rem;
      text-align: center;
      color: #6b7280;
      line-height: 1.4;
    }

    /* État erreur */
    .error-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #b91c1c;
      margin-top: 10px;
      margin-bottom: 4px;
    }
    .error-text {
      font-size: 0.9rem;
      color: #7f1d1d;
      margin-bottom: 10px;
    }
    .error-hint {
      font-size: 0.8rem;
      color: #6b7280;
    }
    .error-hint code {
      background: #fee2e2;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 0.76rem;
      border: 1px solid #fecaca;
      color: #7f1d1d;
    }

    @media (max-width: 480px) {
      .card {
        padding: 20px 16px 18px;
        border-radius: 22px;
      }
      .header {
        margin-top: 22px;
      }
      .title {
        font-size: 1.6rem;
      }
      .subtitle {
        font-size: 0.88rem;
      }
      #qrcode {
        width: 220px;
        height: 220px;
      }
    }
  </style>
</head>
<body>
  <!-- halos animés -->
  <div class="glow" style="top:-10%;left:-5%;"></div>
  <div class="glow glow-2" style="bottom:-20%;right:-10%;"></div>

  <!-- neige -->
  <div class="snow" id="snow-layer"></div>

  <div class="wrapper">
    <div class="card" id="card">
      <div class="ribbon">Fête de fin d’année</div>

      <div class="header">
        <div class="school">Lycée Français International de Vientiane</div>
        <div class="title">Soirée de Noël</div>
        <div class="year">2025 • Accès familles</div>
      </div>

      <p class="subtitle">
        Nous n’avons pas trouvé votre <span class="highlight">code famille</span>.
      </p>
      <p class="tagline">
        Le lien doit ressembler à :
        <br><code>https://noel.lfiv.org/?c=12345</code>
      </p>
    </div>
  </div>

  <script>
    // --- Flocons animés ---
    (function createSnow() {
      const snowLayer = document.getElementById("snow-layer");
      const flakes = 40;
      for (let i = 0; i < flakes; i++) {
        const span = document.createElement("span");
        span.className = "snowflake";
        span.textContent = Math.random() > 0.6 ? "❆" : "❄";
        span.style.left = Math.random() * 100 + "%";
        span.style.fontSize = (Math.random() * 10 + 8) + "px";
        span.style.animationDuration = (Math.random() * 8 + 10) + "s";
        span.style.animationDelay = (Math.random() * 8) + "s";
        snowLayer.appendChild(span);
      }
    })();

    (function init() {
      const params = new URLSearchParams(window.location.search);
      const code = (params.get("c") || "").trim();
      const card = document.getElementById("card");

      if (!code) {
        // on laisse l’état erreur
        return;
      }

      // Contenu "succès"
      card.innerHTML = `
        <div class="ribbon">Invitation famille 🎅</div>

        <div class="header">
          <div class="school">Lycée Français International de Vientiane</div>
          <div class="title">Soirée de Noël</div>
          <div class="year">2025 • Accès famille</div>
        </div>

        <p class="subtitle">
          Présentez ce <span class="highlight">QR code</span> à l'entrée le soir de la fête.<br>
          Un seul QR par famille suffit.
        </p>
        <p class="tagline">
          Pour gagner du temps, gardez cette page ouverte ou faites une capture d'écran.
        </p>

        <div class="code-pill">
          <span>Code famille :</span>
          <span class="code-value">${code}</span>
        </div>

        <div class="qr-wrapper">
          <div class="qr-card">
            <div id="qrcode"></div>
          </div>
        </div>

        <p class="qr-caption">
          Ce QR est <strong>unique</strong> pour votre famille.
          <small>En cas de souci, l’équipe d’accueil pourra vous aider.</small>
        </p>

        <div class="actions">
          <button type="button" class="btn-download" id="download-btn">
            📥 Télécharger le QR
          </button>
        </div>

        <div class="footer">
          Merci de présenter ce QR dès votre arrivée à l'accueil.
        </div>
      `;

      const qrContainer = document.getElementById("qrcode");
      if (!qrContainer) return;

      // URL contenue dans le QR (identique à celle envoyée aux parents)
      const url = window.location.origin + window.location.pathname + "?c=" + encodeURIComponent(code);

      // QR ultra standard : noir sur fond blanc
      new QRCode(qrContainer, {
        text: url,
        width: 260,
        height: 260,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      // bouton de téléchargement
      const downloadBtn = document.getElementById("download-btn");
      if (downloadBtn) {
        downloadBtn.addEventListener("click", function () {
          const canvas = qrContainer.querySelector("canvas");
          const img = qrContainer.querySelector("img");
          let dataUrl = null;

          if (canvas && canvas.toDataURL) {
            dataUrl = canvas.toDataURL("image/png");
          } else if (img && img.src) {
            dataUrl = img.src;
          }

          if (!dataUrl) return;

          const a = document.createElement("a");
          a.href = dataUrl;
          a.download = "LFIV_Noel_QR_" + code + ".png";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        });
      }
    })();
  </script>
</body>
</html>
