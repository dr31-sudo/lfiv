<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>LFIV Noël – QR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #8B0000;
      color: #ffffff;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #ffffff;
      color: #1f2933;
      border-radius: 20px;
      padding: 1.5rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      text-align: center;
    }
    .logo {
      font-weight: 900;
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: #b91c1c;
      letter-spacing: 2px;
    }
    .subtitle {
      font-size: 0.95rem;
      margin-bottom: 0.75rem;
      color: #4b5563;
    }
    .name {
      font-size: 1.4rem;
      font-weight: 700;
      color: #b91c1c;
      margin: 0.5rem 0 1rem;
    }
    .info-line {
      margin: 0.2rem 0;
      font-size: 0.95rem;
    }
    .qr-box {
      margin: 1.2rem auto;
      padding: 0.75rem;
      border-radius: 16px;
      border: 1px solid #e5e7eb;
      display: inline-block;
      background: #f9fafb;
    }
    #qrcode {
      width: 260px;
      height: 260px;
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.8rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .badge-parent { background: #fee2e2; color: #991b1b; }
    .badge-ok { background: #dcfce7; color: #166534; }
    .badge-warn { background: #fef3c7; color: #92400e; }

    .status-title {
      font-size: 1.5rem;
      margin: 0.5rem 0;
    }
    .status-ok { color: #15803d; }
    .status-warn { color: #92400e; }

    .time-info {
      margin-top: 0.6rem;
      font-size: 0.85rem;
      color: #4b5563;
    }

    .error {
      font-size: 1.2rem;
      color: #b91c1c;
      margin-top: 0.5rem;
    }
  </style>

  <!-- Librairie pour générer le QR côté navigateur -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="card" id="card">
    <div class="logo">LFIV</div>
    <p class="subtitle">Chargement du QR…</p>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const mode = (params.get('mode') || 'parent').toLowerCase();
      const p = params.get('p'); // JSON encodé
      const card = document.getElementById('card');

      function showError(msg) {
        card.innerHTML = `
          <div class="logo">LFIV</div>
          <p class="error">❌ QR invalide</p>
          <p>${msg}</p>
        `;
      }

      if (!p) {
        showError("Paramètre <code>p</code> manquant dans l'URL.");
        return;
      }

      let data;
      let jsonString;
      try {
        jsonString = decodeURIComponent(p);
        data = JSON.parse(jsonString);
      } catch (e) {
        console.error(e);
        showError("Données illisibles. QR ou lien corrompu.");
        return;
      }

      const id = data.id || data.code || "inconnu";
      const enfant = data.enfant || "";
      const parent = data.parent || "";
      const classe = data.classe || "";

      // ---------- MODE PARENT : AFFICHER LE QR ----------
      if (mode === 'parent') {
        const scanUrl = window.location.origin + window.location.pathname +
          '?mode=scan&p=' + encodeURIComponent(jsonString);

        card.innerHTML = `
          <div class="logo">LFIV</div>
          <div class="badge badge-parent">Carte famille</div>
          <div class="name">${parent || "Famille"}</div>
          <p class="info-line"><strong>Enfant :</strong> ${enfant || "-"}</p>
          <p class="info-line"><strong>Classe :</strong> ${classe || "-"}</p>
          <div class="qr-box">
            <div id="qrcode"></div>
          </div>
          <p class="subtitle">Présentez ce QR à l'entrée de la fête.</p>
        `;

        const qrContainer = document.getElementById('qrcode');
        new QRCode(qrContainer, {
          text: scanUrl,
          width: 260,
          height: 260,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
        return;
      }

      // ---------- MODE SCAN : CONTRÔLE ENTRÉE ----------
      if (mode === 'scan') {
        const key = 'lfiv_noel_2025_' + id;
        const existing = localStorage.getItem(key);
        const now = new Date();

        if (!existing) {
          // Première entrée
          localStorage.setItem(key, now.toISOString());
          card.innerHTML = `
            <div class="logo">LFIV</div>
            <div class="badge badge-ok">Entrée enregistrée</div>
            <h1 class="status-title status-ok">✅ ENTRÉE OK</h1>
            <div class="name">${parent || "Famille"}</div>
            <p class="info-line"><strong>Enfant :</strong> ${enfant || "-"}</p>
            <p class="info-line"><strong>Classe :</strong> ${classe || "-"}</p>
            <p class="time-info">Scanné à : ${now.toLocaleTimeString()}</p>
          `;
        } else {
          const firstDate = new Date(existing);
          card.innerHTML = `
            <div class="logo">LFIV</div>
            <div class="badge badge-warn">Déjà scanné</div>
            <h1 class="status-title status-warn">⚠️ DÉJÀ SCANNÉ</h1>
            <div class="name">${parent || "Famille"}</div>
            <p class="info-line"><strong>Enfant :</strong> ${enfant || "-"}</p>
            <p class="info-line"><strong>Classe :</strong> ${classe || "-"}</p>
            <p class="time-info">Premier scan : ${firstDate.toLocaleTimeString()}</p>
          `;
        }
        return;
      }

      // ---------- MODE INCONNU ----------
      showError("Mode inconnu. Utiliser <code>mode=parent</code> ou <code>mode=scan</code>.");
    })();
  </script>
</body>
</html>
